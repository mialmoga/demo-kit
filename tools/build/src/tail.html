
</script>
<script>
/* Fondo vivo del estudio: aurora violeta/cian + constelación de partículas.
   Idle tranquilo: arranca con vida, la energía decae y llega a la quietud (el bucle se detiene).
   Despierta con un toque, tecla, rueda o Play; mientras suena se mantiene en un vaivén suave. */
(function(){
  try{
    var cv=document.getElementById('bgfx'); if(!cv) return;
    var g=cv.getContext('2d'); if(!g) return;
    var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    var DPR=Math.min(window.devicePixelRatio||1,1.5), W=0,H=0;
    var small=Math.min(innerWidth,innerHeight)<700;
    var N=small?34:70, LINK=small?110:140;
    function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
    var R=rng(24061986), P=[];
    for(var i=0;i<N;i++){
      var a=R()*6.2832, sp=.004+R()*.012;
      P.push({x:R(),y:R(),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:.7+R()*1.6,ph:R()*6.28,tw:.5+R()*1.2,c:R()<.5?0:1});
    }
    var BL=[ /* manchas de aurora: x,y base, amplitud, fase, velocidad, radio, color */
      {x:.15,y:.10,ax:.10,ay:.07,ph:0,  sp:.11,r:.62,c:'168,85,247',al:.30},
      {x:.88,y:.18,ax:.08,ay:.10,ph:2.1,sp:.09,r:.55,c:'34,211,238',al:.22},
      {x:.50,y:.98,ax:.14,ay:.05,ph:4.2,sp:.07,r:.70,c:'99,102,241',al:.26}
    ];
    var E=reduce?0:1, T=0, last=0, lastAct=performance.now(), playing=false, raf=0;
    var HOLD=1600, TAU=2200, REST=.012;

    function size(){
      W=innerWidth;H=innerHeight;
      cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
      g.setTransform(DPR,0,0,DPR,0,0);
    }
    function render(){
      g.clearRect(0,0,W,H);
      g.globalCompositeOperation='lighter';
      var m=Math.max(W,H);
      for(var i=0;i<BL.length;i++){
        var b=BL[i], cx=(b.x+Math.sin(T*b.sp+b.ph)*b.ax)*W, cy=(b.y+Math.cos(T*b.sp*.83+b.ph)*b.ay)*H, r=b.r*m;
        var gr=g.createRadialGradient(cx,cy,0,cx,cy,r);
        gr.addColorStop(0,'rgba('+b.c+','+b.al+')');gr.addColorStop(1,'rgba('+b.c+',0)');
        g.fillStyle=gr;g.fillRect(0,0,W,H);
      }
      var pts=[],j,k,p;
      for(j=0;j<N;j++){
        p=P[j];
        var px=((p.x+p.vx*T)%1+1)%1*W, py=((p.y+p.vy*T)%1+1)%1*H;
        pts.push(px,py);
      }
      g.lineWidth=1;
      for(j=0;j<N;j++){
        for(k=j+1;k<N;k++){
          var dx=pts[j*2]-pts[k*2], dy=pts[j*2+1]-pts[k*2+1], d=dx*dx+dy*dy;
          if(d<LINK*LINK){
            var al=(1-Math.sqrt(d)/LINK)*.20;
            g.strokeStyle='rgba(165,180,252,'+al.toFixed(3)+')';
            g.beginPath();g.moveTo(pts[j*2],pts[j*2+1]);g.lineTo(pts[k*2],pts[k*2+1]);g.stroke();
          }
        }
      }
      for(j=0;j<N;j++){
        p=P[j];
        var tw=.55+.45*Math.sin(T*p.tw+p.ph);
        g.fillStyle=p.c?'rgba(34,211,238,'+(.75*tw).toFixed(3)+')':'rgba(216,180,254,'+(.75*tw).toFixed(3)+')';
        g.beginPath();g.arc(pts[j*2],pts[j*2+1],p.r,0,6.2832);g.fill();
      }
      g.globalCompositeOperation='source-over';
    }
    function frame(now){
      raf=0; if(dis) return;
      var raw=now-last; if(prevT&&!document.hidden&&raw<1000){ if(raw>45) slow++; else if(slow>0) slow-=.5; if(slow>=40&&window.__perfSlow){ slow=0; try{window.__perfSlow();}catch(e){} } } prevT=now;
      var dt=Math.min((now-last)/1000,.1); last=now;
      var vl=(window.__viz&&window.__viz.level)||0;var target=playing?Math.min(1,.4+vl*2.2):((now-lastAct<HOLD)?Math.min(1,.5+vl*2):0);
      var k=1-Math.exp(-dt*1000/(target>E?380:TAU));
      E+=(target-E)*k;
      T+=dt*E*(reduce?0:1);
      render();
      if(!playing&&target===0&&E<REST){E=0;render();return;} /* quietud: se detiene el bucle */
      raf=requestAnimationFrame(frame);
    }
    var dis=false, slow=0, prevT=0;
    function wake(){
      if(reduce||dis) return;
      lastAct=performance.now();
      if(!raf){last=performance.now();raf=requestAnimationFrame(frame);}
    }
    size();render();
    dis=document.documentElement.dataset.fx==='off'||document.documentElement.dataset.skin==='classic';
    window.__bgfx={enable:function(on){ dis=!on; if(dis){ if(raf){cancelAnimationFrame(raf);raf=0;} prevT=0; } else { size(); render(); wake(); } }};
    if(!reduce&&!dis){last=performance.now();raf=requestAnimationFrame(frame);}
    addEventListener('resize',function(){size();render();});
    ['pointerdown','keydown','wheel','touchstart'].forEach(function(ev){addEventListener(ev,wake,{passive:true,capture:true});});
    document.addEventListener('visibilitychange',function(){if(!document.hidden)wake();});

    if(window.__viz)window.__viz.onWake=wake;
    var bp=document.getElementById('bPlay');
    if(bp){
      var chk=function(){var was=playing;playing=!/▶/.test(bp.textContent);if(playing&&!was)wake();else if(!playing&&was)lastAct=performance.now();};
      new MutationObserver(chk).observe(bp,{childList:true,characterData:true,subtree:true});
      chk();
    }
  }catch(e){console.warn('bgfx',e);}
})();
</script>

<script>
/* Espectro general detrás/sobre el piano roll: silueta suave que respira con el sonido (sin alinearse a las filas).
   Capa con mezcla «screen», sin capturar toques. Sin sonido se disuelve y el bucle se detiene. */
(function(){
  var V=window.__viz;if(!V)return;
  var roll=document.getElementById('roll'),wrap=document.getElementById('wrap');if(!roll||!wrap)return;
  var cv=document.createElement('canvas');cv.id='rspec';cv.setAttribute('aria-hidden','true');roll.appendChild(cv);
  var g=cv.getContext('2d'),W=0,H=0,N=72,bands=V.makeBands(N,40,15000),cleared=false;
  var X0=(typeof KW==='number'?KW:62);
  function place(){
    var dpr=Math.min(window.devicePixelRatio||1,1.5);
    W=wrap.clientWidth;H=wrap.clientHeight;
    cv.style.left=wrap.offsetLeft+'px';cv.style.top=wrap.offsetTop+'px';cv.style.width=W+'px';cv.style.height=H+'px';
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);g.setTransform(dpr,0,0,dpr,0,0);cleared=false;V.redraw();
  }
  if(window.ResizeObserver){var ro=new ResizeObserver(place);ro.observe(wrap);ro.observe(roll);}else addEventListener('resize',place);
  V.drawers.push(function(now,V){
    if(!W||!H)return;
    var b=bands(),i,mx=0;for(i=0;i<N;i++)if(b[i]>mx)mx=b[i];
    if(mx<.012&&V.level<.003){if(!cleared){g.clearRect(0,0,W,H);cleared=true;}return;}
    cleared=false;g.clearRect(0,0,W,H);
    var x0=Math.min(X0,W*.3),span=W-x0,top=H*.62;
    var gr=g.createLinearGradient(0,H,0,H-top);
    gr.addColorStop(0,'rgba(168,85,247,.55)');gr.addColorStop(.55,'rgba(99,102,241,.22)');gr.addColorStop(1,'rgba(34,211,238,0)');
    g.beginPath();g.moveTo(x0,H);
    var px=x0,py=H-b[0]*top;g.lineTo(px,py);
    for(i=1;i<N;i++){var x=x0+i/(N-1)*span,y=H-b[i]*top,mx2=(px+x)/2,my=(py+y)/2;g.quadraticCurveTo(px,py,mx2,my);px=x;py=y;}
    g.lineTo(px,py);g.lineTo(W,H);g.closePath();g.fillStyle=gr;g.fill();
    /* línea de cresta */
    var lg=g.createLinearGradient(x0,0,W,0);lg.addColorStop(0,'rgba(34,211,238,.75)');lg.addColorStop(.55,'rgba(168,85,247,.75)');lg.addColorStop(1,'rgba(236,72,153,.7)');
    g.beginPath();px=x0;py=H-b[0]*top;g.moveTo(px,py);
    for(i=1;i<N;i++){var x1=x0+i/(N-1)*span,y1=H-b[i]*top,mx3=(px+x1)/2,my3=(py+y1)/2;g.quadraticCurveTo(px,py,mx3,my3);px=x1;py=y1;}
    g.lineTo(px,py);g.strokeStyle=lg;g.lineWidth=1.5;g.shadowColor='rgba(168,85,247,.7)';g.shadowBlur=8;g.stroke();g.shadowBlur=0;
  });
  place();
})();
</script>

<script>
/* Panel de pistas colapsable en móvil: una flechita deja solo la pista activa (un renglón); se recuerda el estado. */
(function(){
  var a=document.getElementById('tracks'),b=document.getElementById('tToggle');if(!a||!b)return;
  function set(c,save){
    a.classList.toggle('tcol',c);b.setAttribute('aria-expanded',String(!c));
    b.textContent=c?'▾':'▴';b.title=c?'Mostrar todas las pistas':'Colapsar: solo la pista activa';
    if(save){try{localStorage.setItem('demokit-tcol',c?'1':'0');}catch(e){}}
  }
  b.addEventListener('click',function(){set(!a.classList.contains('tcol'),true);});
  var v=null;try{v=localStorage.getItem('demokit-tcol');}catch(e){}
  set(v==='1',false);
})();
</script>
